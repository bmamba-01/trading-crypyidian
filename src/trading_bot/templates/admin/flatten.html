{% extends "admin/base.html" %}
{% block title %}Flatten workspace — Crypidian{% endblock %}
{% block heading %}Flatten workspace PAPER{% endblock %}
{% block content %}
<p>Tạo preview các vị thế và lệnh PAPER đang mở. Xác nhận yêu cầu owner và MFA gần đây.</p>
<form method="post" action="/admin/flatten/preview">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
  <label for="flatten-reason">Lý do</label>
  <textarea id="flatten-reason" name="reason" maxlength="500" required></textarea>
  <button type="submit">Xem preview</button>
</form>
{% endblock %}
