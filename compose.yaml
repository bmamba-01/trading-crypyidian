name: crypidian

services:
  postgres:
    image: postgres:18.1-bookworm@sha256:cc9f4143a8d2fa8cf3749d0cb4d26ecf2d53a77a2ac807e9ebd67ae22426221a
    environment:
      POSTGRES_DB: crypidian
      POSTGRES_USER: crypidian_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  object-store:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    env_file:
      - ./.secrets/garage.env
    secrets:
      - garage_rpc_secret
    networks:
      - backend
    volumes:
      - garage_data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  admin-web:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: admin-web
      TRADING_BOT_DATABASE_USER: crypidian_admin_web
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_admin_web_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
      TRADING_BOT_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      TRADING_BOT_MFA_SECRET_DIRECTORY: /var/lib/crypidian/mfa-secrets
      TRADING_BOT_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
    depends_on:
      mfa-volume-provisioner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    networks:
      - backend
      - web_ingress
    ports:
      - "127.0.0.1:${TRADING_BOT_WEB_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - database_admin_web_password
      - mfa_encryption_key
      - bootstrap_token
    volumes:
      - mfa_secrets:/var/lib/crypidian/mfa-secrets
    healthcheck: &application_healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mfa-volume-provisioner:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "scripts/provision_mfa_secret_volume.py"]
    volumes:
      - mfa_secrets:/var/lib/crypidian/mfa-secrets
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  migrator:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["alembic", "upgrade", "head"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_admin
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
    secrets:
      - postgres_password
    networks:
      - backend
    volumes:
      - ./migrations:/app/migrations
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  db-provisioner:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "scripts/provision_database_roles.py"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_admin
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
      - database_admin_web_password
      - database_trading_runtime_password
      - database_execution_gateway_password
      - database_ingestion_worker_password
      - database_trainer_worker_password
    networks:
      - backend
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  trading-runtime:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: trading-runtime
      # UUID deployment scope; thay bằng workspace đã được provision trước khi chạy runtime.
      TRADING_BOT_RUNTIME_WORKSPACE_ID: ${TRADING_BOT_RUNTIME_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_DATABASE_USER: crypidian_trading_runtime
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_trading_runtime_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_trading_runtime_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  execution-gateway:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: execution-gateway
      TRADING_BOT_DATABASE_USER: crypidian_execution_gateway
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_execution_gateway_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: binance_api_key
        target: binance_api_key
      - source: binance_api_secret
        target: binance_api_secret
      - source: database_execution_gateway_password
        target: /run/secrets/database_execution_gateway_password
    networks:
      - backend
      - exchange_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  ingestion-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: ingestion-worker
      TRADING_BOT_DATABASE_USER: crypidian_ingestion_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_ingestion_worker_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    networks:
      - backend
      - source_egress
    secrets:
      - database_ingestion_worker_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  trainer-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: trainer-worker
      TRADING_BOT_DATABASE_USER: crypidian_trainer_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_trainer_worker_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_trainer_worker_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

networks:
  backend:
    internal: true
  web_ingress:
  exchange_egress:
  source_egress:

volumes:
  garage_data:
  postgres_data:
  mfa_secrets:

secrets:
  binance_api_key:
    file: ./.secrets/binance_api_key
  binance_api_secret:
    file: ./.secrets/binance_api_secret
  garage_rpc_secret:
    file: ./.secrets/garage_rpc_secret
  postgres_password:
    file: ./.secrets/postgres_password
  database_admin_web_password:
    file: ./.secrets/database_admin_web_password
  mfa_encryption_key:
    file: ./.secrets/mfa_encryption_key
  bootstrap_token:
    file: ./.secrets/bootstrap_token
  database_trading_runtime_password:
    file: ./.secrets/database_trading_runtime_password
  database_execution_gateway_password:
    file: ./.secrets/database_execution_gateway_password
  database_ingestion_worker_password:
    file: ./.secrets/database_ingestion_worker_password
  database_trainer_worker_password:
    file: ./.secrets/database_trainer_worker_password
