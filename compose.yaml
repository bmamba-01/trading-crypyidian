name: crypidian

# Cùng một policy TEST phải được đọc bởi evaluator và runtime để so khớp hash lineage.
x-scorer-test-policy-environment: &scorer_test_policy_environment
  TRADING_BOT_SCORER_TEST_POLICY_VERSION: ${TRADING_BOT_SCORER_TEST_POLICY_VERSION:-wp06-scorer-test-v1}
  TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_SAMPLE_COUNT: ${TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_SAMPLE_COUNT:-1000}
  TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CLASS_SUPPORT: ${TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CLASS_SUPPORT:-100}
  TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_CALIBRATION_ERROR: ${TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_CALIBRATION_ERROR:-0.05}
  TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_LOG_LOSS_REGRESSION: ${TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_LOG_LOSS_REGRESSION:-0.01}
  TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_BRIER_REGRESSION: ${TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_BRIER_REGRESSION:-0.01}
  TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_COVERAGE: ${TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_COVERAGE:-0.80}
  TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CANDIDATE_RETENTION: ${TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CANDIDATE_RETENTION:-0.20}
  TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_FALSE_VETO_RATE: ${TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_FALSE_VETO_RATE:-0.10}
  TRADING_BOT_SCORER_TEST_POLICY_APPROVE_PROBABILITY_THRESHOLD: ${TRADING_BOT_SCORER_TEST_POLICY_APPROVE_PROBABILITY_THRESHOLD:-0.60}
  TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CONFIDENCE: ${TRADING_BOT_SCORER_TEST_POLICY_MINIMUM_CONFIDENCE:-0.55}
  TRADING_BOT_SCORER_TEST_POLICY_RELIABILITY_BIN_COUNT: ${TRADING_BOT_SCORER_TEST_POLICY_RELIABILITY_BIN_COUNT:-10}
  TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_STANDARDIZED_FEATURE_DEVIATION: ${TRADING_BOT_SCORER_TEST_POLICY_MAXIMUM_STANDARDIZED_FEATURE_DEVIATION:-6.0}
  TRADING_BOT_SCORER_TEST_POLICY_RUNTIME_INFERENCE_TIMEOUT_MS: ${TRADING_BOT_SCORER_TEST_POLICY_RUNTIME_INFERENCE_TIMEOUT_MS:-100}

services:
  postgres:
    # SEC-02: minor 18.6 (vá CVE-2026-14666 và các CVE 18.2–18.6); digest là OCI index đa kiến trúc.
    image: postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
    environment:
      POSTGRES_DB: crypidian
      POSTGRES_USER: crypidian_admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
    networks:
      - backend
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  object-store:
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    command: ["/garage", "server", "--single-node", "--default-bucket"]
    environment:
      GARAGE_CONFIG_FILE: /etc/garage.toml
    env_file:
      - ./.secrets/garage.env
    secrets:
      - garage_rpc_secret
    networks:
      - backend
    volumes:
      - garage_data:/var/lib/garage
      - ./infra/garage/garage.toml:/etc/garage.toml:ro
    healthcheck:
      test: ["CMD", "/garage", "status"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  admin-web:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      <<: *scorer_test_policy_environment
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: admin-web
      # Cờ kiểm thử local: chấp nhận mã xác thực cố định 123456. Mặc định tắt; cấu hình từ chối
      # bật khi app_env không phải local/test hoặc mode không phải PAPER.
      TRADING_BOT_AUTH_TEST_TOTP_ENABLED: ${TRADING_BOT_AUTH_TEST_TOTP_ENABLED:-false}
      TRADING_BOT_DATABASE_USER: crypidian_admin_web
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_admin_web_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
      TRADING_BOT_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      TRADING_BOT_MFA_SECRET_DIRECTORY: /var/lib/crypidian/mfa-secrets
      TRADING_BOT_BOOTSTRAP_TOKEN_FILE: /run/secrets/bootstrap_token
      TRADING_BOT_TELEGRAM_BOT_USERNAME: ${TRADING_BOT_TELEGRAM_BOT_USERNAME:-}
      TRADING_BOT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
    depends_on:
      mfa-volume-provisioner:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
      object-store:
        condition: service_healthy
    networks:
      - backend
      - web_ingress
    ports:
      - "127.0.0.1:${TRADING_BOT_WEB_PORT:-8000}:8000"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    secrets:
      - database_admin_web_password
      - mfa_encryption_key
      - bootstrap_token
      - telegram_bot_token
    volumes:
      - mfa_secrets:/var/lib/crypidian/mfa-secrets
    healthcheck: &application_healthcheck
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  mfa-volume-provisioner:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "scripts/provision_mfa_secret_volume.py"]
    volumes:
      - mfa_secrets:/var/lib/crypidian/mfa-secrets
    user: "0:0"
    cap_drop: ["ALL"]
    cap_add: ["CHOWN"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  migrator:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["alembic", "upgrade", "head"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_admin
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
    depends_on:
      db-provisioner:
        condition: service_completed_successfully
    secrets:
      - postgres_password
    networks:
      - backend
    volumes:
      - ./migrations:/app/migrations
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  db-provisioner:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "scripts/provision_database_roles.py"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_admin
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - postgres_password
      - database_admin_web_password
      - database_trading_runtime_password
      - database_execution_gateway_password
      - database_ingestion_worker_password
      - database_trainer_worker_password
      - database_learning_evaluator_password
      - database_learning_shadow_observer_password
      - database_candidate_builder_password
      - database_replay_writer_password
      - database_backtest_worker_password
      - database_signal_worker_password
      - database_market_signal_worker_password
    networks:
      - backend
    read_only: true
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]

  # Chỉ local/test: gieo dataset QA qua `scripts/seed_qa_data.py seed --local-only`.
  # Profile riêng nên `up` mặc định không chạy; credentials đi qua stdin, không qua env.
  qa-seed:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    profiles: ["qa"]
    command: ["python", "/qa/scripts/seed_qa_data.py", "apply"]
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_DATABASE_USER: crypidian_admin
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/postgres_password
      TRADING_BOT_DATABASE_HOST: postgres
      TRADING_BOT_DATABASE_NAME: crypidian
      TRADING_BOT_MFA_ENCRYPTION_KEY_FILE: /run/secrets/mfa_encryption_key
      TRADING_BOT_MFA_SECRET_DIRECTORY: /var/lib/crypidian/mfa-secrets
    depends_on:
      migrator:
        condition: service_completed_successfully
      mfa-volume-provisioner:
        condition: service_completed_successfully
    secrets:
      - postgres_password
      - mfa_encryption_key
    networks:
      - backend
    volumes:
      - mfa_secrets:/var/lib/crypidian/mfa-secrets
      - ./scripts/seed_qa_data.py:/qa/scripts/seed_qa_data.py:ro
      - ./scripts/qa_seed_layers.py:/qa/scripts/qa_seed_layers.py:ro
      - ./tests/fixtures/qa_dataset:/qa/tests/fixtures/qa_dataset:ro
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  trading-runtime:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      <<: *scorer_test_policy_environment
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: trading-runtime
      # UUID deployment scope; thay bằng workspace đã được provision trước khi chạy runtime.
      TRADING_BOT_RUNTIME_WORKSPACE_ID: ${TRADING_BOT_RUNTIME_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_DATABASE_USER: crypidian_trading_runtime
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_trading_runtime_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_trading_runtime_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  execution-gateway:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: execution-gateway
      TRADING_BOT_DATABASE_USER: crypidian_execution_gateway
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_execution_gateway_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
    secrets:
      - source: binance_api_key
        target: binance_api_key
      - source: binance_api_secret
        target: binance_api_secret
      - source: database_execution_gateway_password
        target: /run/secrets/database_execution_gateway_password
    networks:
      - backend
      - exchange_egress
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  ingestion-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: ingestion-worker
      # Worker này chỉ xử lý một workspace; thay UUID mẫu bằng workspace đã provision.
      TRADING_BOT_INGESTION_WORKSPACE_ID: ${TRADING_BOT_INGESTION_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_INGESTION_WORKER_TICK_SECONDS: ${TRADING_BOT_INGESTION_WORKER_TICK_SECONDS:-5}
      TRADING_BOT_DATABASE_USER: crypidian_ingestion_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_ingestion_worker_password
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    networks:
      - backend
      - source_egress
    secrets:
      - database_ingestion_worker_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=2).read()"
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

  candidate-proof-builder:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "-m", "trading_bot.cli.candidate_proof"]
    profiles: ["learning-proof"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_candidate_builder
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_candidate_builder_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_candidate_builder_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  learning-split-builder:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "-m", "trading_bot.cli.learning_split_candidate"]
    profiles: ["learning-proof"]
    environment:
      TRADING_BOT_DATABASE_USER: crypidian_candidate_builder
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_candidate_builder_password
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_candidate_builder_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  trainer-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: trainer-worker
      TRADING_BOT_DATABASE_USER: crypidian_trainer_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_trainer_worker_password
      TRADING_BOT_LEARNING_TRAINING_WORKSPACE_ID: ${TRADING_BOT_LEARNING_TRAINING_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
    profiles: ["paper"]
    depends_on:
      postgres:
        condition: service_healthy
      object-store:
        condition: service_healthy
    networks:
      - backend
    secrets:
      - database_trainer_worker_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    cpus: 1.0
    mem_limit: 1g
    pids_limit: 64
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
          pids: 64
    restart: unless-stopped
    stop_grace_period: 330s

  learning-shadow-observer:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "-m", "trading_bot.cli.learning_shadow", "run"]
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: learning-shadow-observer
      TRADING_BOT_DATABASE_USER: crypidian_learning_shadow_observer
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_learning_shadow_observer_password
      TRADING_BOT_LEARNING_SHADOW_OBSERVER_WORKSPACE_ID: ${TRADING_BOT_LEARNING_SHADOW_OBSERVER_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
    profiles: ["learning"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
    secrets:
      - database_learning_shadow_observer_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    cpus: 0.5
    mem_limit: 256m
    pids_limit: 32
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256m
          pids: 32
    restart: unless-stopped
    stop_grace_period: 20s

  learning-evaluator:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "-m", "trading_bot.cli.learning_evaluation"]
    environment:
      <<: *scorer_test_policy_environment
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: learning-evaluator
      TRADING_BOT_DATABASE_USER: crypidian_learning_evaluator
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_learning_evaluator_password
    profiles: ["learning"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
    secrets:
      - database_learning_evaluator_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  backtest-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    command: ["python", "-m", "trading_bot.cli.backtest_replay", "worker"]
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: backtest-worker
      # Mỗi worker được scope vào một workspace để không cần bypass RLS.
      TRADING_BOT_BACKTEST_WORKER_WORKSPACE_ID: ${TRADING_BOT_BACKTEST_WORKER_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_BACKTEST_WORKER_TICK_SECONDS: ${TRADING_BOT_BACKTEST_WORKER_TICK_SECONDS:-2}
      TRADING_BOT_BACKTEST_WORKER_LEASE_SECONDS: ${TRADING_BOT_BACKTEST_WORKER_LEASE_SECONDS:-120}
      TRADING_BOT_DATABASE_USER: crypidian_backtest_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_backtest_worker_password
      TRADING_BOT_BACKTEST_REPLAY_DATABASE_USER: crypidian_replay_writer
      TRADING_BOT_BACKTEST_REPLAY_DATABASE_PASSWORD_FILE: /run/secrets/database_replay_writer_password
    profiles: ["backtest"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
    secrets:
      - database_backtest_worker_password
      - database_replay_writer_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  telegram-signal-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: signal-worker
      # Thay UUID mẫu bằng workspace có bot decision và subscription Telegram.
      TRADING_BOT_SIGNAL_WORKSPACE_ID: ${TRADING_BOT_SIGNAL_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_SIGNAL_WORKER_TICK_SECONDS: ${TRADING_BOT_SIGNAL_WORKER_TICK_SECONDS:-5}
      TRADING_BOT_SIGNAL_WORKER_MAX_CANDIDATE_AGE_SECONDS: ${TRADING_BOT_SIGNAL_WORKER_MAX_CANDIDATE_AGE_SECONDS:-7200}
      TRADING_BOT_SIGNAL_WORKER_MAX_ATTEMPTS: ${TRADING_BOT_SIGNAL_WORKER_MAX_ATTEMPTS:-5}
      TRADING_BOT_TELEGRAM_BOT_TOKEN_FILE: /run/secrets/telegram_bot_token
      TRADING_BOT_DATABASE_USER: crypidian_signal_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_signal_worker_password
    profiles: ["signal"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
      - telegram_egress
    secrets:
      - database_signal_worker_password
      - telegram_bot_token
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

  market-signal-worker:
    image: ${CRYPIDIAN_APP_IMAGE:-crypidian-app:local}
    environment:
      <<: *scorer_test_policy_environment
      TRADING_BOT_APP_ENV: local
      TRADING_BOT_TRADING_MODE: PAPER
      TRADING_BOT_PROCESS_ROLE: market-signal-worker
      # Thay UUID mẫu bằng workspace có bot PAPER đã publish và nến trong DB.
      TRADING_BOT_MARKET_SIGNAL_WORKSPACE_ID: ${TRADING_BOT_MARKET_SIGNAL_WORKSPACE_ID:-00000000-0000-0000-0000-000000000000}
      TRADING_BOT_SIGNAL_WORKER_TICK_SECONDS: ${TRADING_BOT_SIGNAL_WORKER_TICK_SECONDS:-5}
      TRADING_BOT_SIGNAL_WORKER_MAX_CANDIDATE_AGE_SECONDS: ${TRADING_BOT_SIGNAL_WORKER_MAX_CANDIDATE_AGE_SECONDS:-7200}
      TRADING_BOT_DATABASE_USER: crypidian_market_signal_worker
      TRADING_BOT_DATABASE_PASSWORD_FILE: /run/secrets/database_market_signal_worker_password
    profiles: ["signal-producer"]
    depends_on:
      postgres:
        condition: service_healthy
      migrator:
        condition: service_completed_successfully
    networks:
      - backend
    secrets:
      - database_market_signal_worker_password
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    user: "10001:10001"
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    healthcheck: *application_healthcheck
    restart: unless-stopped

networks:
  backend:
    internal: true
  web_ingress:
  exchange_egress:
  source_egress:
  telegram_egress:

volumes:
  garage_data:
  postgres_data:
  mfa_secrets:

secrets:
  binance_api_key:
    file: ./.secrets/binance_api_key
  binance_api_secret:
    file: ./.secrets/binance_api_secret
  garage_rpc_secret:
