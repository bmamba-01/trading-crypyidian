# Template Reverse Proxy TLS (Nginx) cho Crypidian Admin Web (SEC-29, SEC-30, SEC-36).
# Tham chiếu (kiểm tra 2026-11-18):
# - https://nginx.org/en/docs/http/ngx_http_proxy_module.html
# - https://nginx.org/en/docs/http/ngx_http_limit_req_module.html
#
# Đưa dòng `limit_req_zone` vào khối `http { ... }` trước khi include file `server {}` này:
#   limit_req_zone $binary_remote_addr zone=crypidian_api:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name admin.crypidian.example;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name admin.crypidian.example;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/admin.crypidian.example/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.crypidian.example/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_timeout 1d;
    ssl_session_cache shared:TLS:10m;
    ssl_session_tickets off;

    # Giới hạn body chung 1 MiB (khớp TRADING_BOT_REQUEST_BODY_MAX_BYTES).
    client_max_body_size 1m;
    client_body_timeout 15s;
    client_header_timeout 15s;

    # SEC-36: webhook Telegram chỉ nhận từ hai dải IP chính thức của Telegram Bot API.
    location ^~ /api/v1/telegram/webhook {
        allow 149.154.160.0/20;
        allow 91.108.4.0/22;
        deny all;

        client_max_body_size 64k;
        proxy_pass http://admin-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
    }

    # Ngoại lệ đúng API upload: chỉ POST trên route này được phép body tối đa 10 MiB.
    location ~ ^/api/v1/research-sources/[^/]+/revisions/[^/]+/license-evidence$ {
        client_max_body_size 10m;
        if ($request_method != POST) { return 405; }

        limit_req zone=crypidian_api burst=20 nodelay;
        limit_req_status 429;

        # Luôn no-store cả khi Nginx tự trả 413; chuẩn hóa header từ upstream thành một giá trị.
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;

        proxy_pass http://admin-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_hide_header Server;
    }

    location / {
        limit_req zone=crypidian_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://admin-web:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Dùng $remote_addr khi Nginx đứng trực tiếp ngoài Internet để chặn giả X-Forwarded-For.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Forwarded "";
        proxy_hide_header Server;
    }
}
